name: Save quiz feedback
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
concurrency:
  group: feedback-ingestion
  cancel-in-progress: false
jobs:
  append:
    if: startsWith(github.event.issue.title, '[Quiz feedback]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append validated feedback with bounded conflict retries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/ingest-feedback.mjs
            if git diff --quiet -- feedback/reports.jsonl; then exit 0; fi
            git add feedback/reports.jsonl
            git commit -m 'feedback: record quiz report'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
